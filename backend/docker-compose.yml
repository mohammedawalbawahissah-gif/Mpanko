services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mpanko
      POSTGRES_USER: mpanko
      POSTGRES_PASSWORD: mpanko
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://mpanko:mpanko@db:5432/mpanko
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A config worker -B -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://mpanko:mpanko@db:5432/mpanko
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  pgdata:
